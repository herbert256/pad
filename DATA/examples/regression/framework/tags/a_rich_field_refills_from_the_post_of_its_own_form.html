i-row pi-slider-row"><div class="pi-slider-track"><input type="range" name="volume" id="volume" min="0" max="10" step="1" value="5" aria-valuetext="5" aria-label="Volume"><div class="pi-slider-ends pi-muted" aria-hidden="true"><span>0</span><span>10</span></div></div><output class="pi-slider-out" for="volume">5</output></div></div></form><form method="post"><input type="hidden" name="padCsrfToken" value="20fa1f0f6464cceb5aaf9f1e4b9162acd2d6c8c2caa2b3de2af2dd3fc7b957ca"><input type="hidden" name="padForm" value="f"><div class="pad-input pad-input-slider" data-pad-input="slider" data-pad-label="Volume" data-config="{&quot;unit&quot;:&quot;&quot;}"><div class="pi-row pi-slider-row"><div class="pi-slider-track"><input type="range" name="volume" id="volume" min="0" max="10" step="1" value="7" aria-valuetext="7" aria-label="Volume"><div class="pi-slider-ends pi-muted" aria-hidden="true"><span>0</span><span>10</span></div></div><output class="pi-slider-out" for="volume">7</output></div></div><div class="pad-input pad-input-toggle" data-pad-input="toggle" data-pad-label="News"><div class="pi-row pi-toggle-row"><input type="hidden" name="news" value="0"><input type="checkbox" role="switch" name="news" id="news" value="1" checked aria-label="News"></div></div><script>/* stars - the button that takes a rating back, for a field that is not required: a radio group once chosen cannot be emptied otherwise. It shows while a star is chosen. */PadInputs.register('stars', function (frame, cfg, kit) { var radios = frame.querySelectorAll('.pi-star-input'); var clear = frame.querySelector('.pi-stars-clear'); if (!radios.length || !clear || !cfg.clear) return; var name = kit.label(frame); clear.setAttribute('aria-label', 'Clear ' + (name || 'the rating')); function chosen() { for (var i = 0; i < radios.length; i++) if (radios[i].checked) return radios[i]; return null; } function sync() { clear.hidden = !chosen(); } frame.addEventListener('change', sync); clear.addEventListener('click', function () { var one = chosen(); if (!one) return; one.checked = false; sync(); kit.changed(radios[0]); radios[0].focus(); }); sync();});</script><fieldset class="pad-input pad-input-stars" data-pad-input="stars" data-pad-label="Score" data-config="{&quot;max&quot;:5,&quot;clear&quot;:true}"><legend>Score</legend><span class="pi-stars"><input type="radio" class="pi-star-input" name="score" id="score" value="1"><label class="pi-star" for="score"><span class="pi-hide">1 star of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-2" value="2"><label class="pi-star" for="score-2"><span class="pi-hide">2 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-3" value="3"><label class="pi-star" for="score-3"><span class="pi-hide">3 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-4" value="4" checked><label class="pi-star" for="score-4"><span class="pi-hide">4 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-5" value="5"><label class="pi-star" for="score-5"><span class="pi-hide">5 stars of 5</span></label></span><button type="button" class="pi-button pi-stars-clear" hidden="">Clear</button></fieldset><script>/* taginput - chips over the comma list. The text field the server wrote gives its name to a hidden field, which holds the words joined with ', ' - what the form posts, the same text the field posted without the script - and becomes the field a word is typed in. Enter or a comma adds the word, a pasted list adds each of its words, leaving the field adds what was typed; Backspace in the empty field takes the last word back, and every chip has a button that takes it out. A word is in the list once, in the case it was first written in. What happens is said to a screen reader. A required list stays one: the text field the words leave holds the browser's required check while there is no word, and lets it go once a chip holds one - add(one)) added = true; }); box.value = ''; if (added) sync(); } box.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ',') { if (box.value.trim() !== '' || event.key === ',') event.preventDefault(); take(); } else if (event.key === 'Backspace' && box.value === '' && words.length) { var word = words.pop(); sync(); say(word + ' removed'); } }); box.addEventListener('input', function () { if (box.value.indexOf(',') >= 0) take(); }); box.addEventListener('change', function () { if (box.value.trim() !== '') take(); }); box.addEventListener('blur', function () { if (box.value.trim() !== '') take(); }); // A click in the frame of chips puts the focus in the field, as in a text field. wrap.addEventListener('click', function (event) { if (event.target === wrap) box.focus(); }); sync(true);});</script><div class="pad-input pad-input-taginput" data-pad-input="taginput" data-pad-label="Topics" data-config="{&quot;most&quot;:0}"><div class="pi-tags"><input type="text" name="topics" id="topics" value="pad, php" autocomplete="off" aria-label="Topics"></div></div><script>/* otp - a box per character over the one-time code. The text field the server wrote becomes the hidden field the form posts; the boxes - a group named by the field's label - take one character each, and the first box takes the field's id, so the label and the messages are its. A character typed moves the focus on, Backspace back - emptying the box before it when it is empty itself - the arrow keys, Home and End move along, and a code pasted or offered by the phone (autocomplete="one-time-code", on the first box) fills the boxes from where it lands - the boxes have no maxlength, so a code a phone puts in the first box whole is spread over them rather than cut to its first character. A character the code cannot hold is not taken. The checks the field carried - required, pattern=, minlength= - stay the code's: a hidden field is one the browser does not check, so the first box holds the code to them, with the browser's own message. */PadInputs.register('otp', function (frame, cfg, kit) { var whole = frame.querySelector('.pi-otp-whole'); if (!whole) return; var length = cfg.length || 6; var allowed = cfg.letters ? /[A-Za-z0-9]/ : /[0-9]/; var id = whole.id; var label = frame.querySelector('label[for="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); var invalid = whole.getAttribute('aria-invalid'); var described = whole.getAttribute('aria-describedby'); var group = kit.el('div', 'pi-otp-boxes'); group.setAttribute('role', 'group'); if (label) { if (!label.id) label.id = kit.id(id + '-label'); group.setAttribute('aria-labelledby', label.id); } else group.setAttribute('aria-label', kit.label(frame)); var boxes = []; for (var i = 0; i < length; i++) { var box = document.createElement('input'); box.type = 'text'; box.className = 'pi-otp-box'; box.setAttribute('inputmode', cfg.letters ? 'text' : 'numeric'); box.setAttribute('autocomplete', i === 0 ? 'one-time-code' : 'off'); box.setAttribute('aria-label', 'Character ' + (i + 1) + ' of ' + length); box.spellcheck = false; if (cfg.letters) box.setAttribute('autocapitalize', 'characters'); if (whole.disabled) box.disabled = true; boxes.push(box); group.appendChild(box); } // The first box is the field the label and the messages point at, marked invalid with // them - the browser's checker clears it there (data-pad-shows); the style marks the // other boxes with it. whole.removeAttribute('id'); boxes[0].id = id; if (invalid) boxes[0].setAttribute('aria-invalid', invalid); if (described) boxes[0].setAttribute('aria-describedby', described); whole.removeAttribute('aria-invalid'); whole.removeAttribute('aria-describedby'); whole.setAttribute('data-pad-shows', id); // The field's checks on a field of their own, outside the form, that the code is put in: // its answer - and the browser's message - is the first box's. A length is checked by the // browser only on what was typed, so minlength= is a pattern here. var probe = document.createElement('input'); probe.type = 'text'; probe.required = whole.required; var least = parseInt(whole.getAttribute('minlength'), 10); var shape = whole.getAttribute('pattern'); if (least > 0 || shape !== null) probe.pattern = (least > 0 ? '(?=[\\s\\S]{' + least + ',})' : '') + '(?:' + (shape !== null ? shape : '[\\s\\S]*') + ')'; if (whole.required) boxes[0].setAttribute('aria-required', 'true'); whole.type = 'hidden'; whole.parentNode.insertBefore(group, whole); function clean(text) { return Array.from(String(text)).filter(function (c) { return allowed.test(c); }).map(function (c) { return c.toUpperCase(); }); } function hold() { probe.value = whole.value; boxes[0].setCustomValidity(probe.checkValidity() ? '' : probe.validationMessage); } function post() { whole.value = boxes.map(function (box) { return box.value; }).join(''); hold(); kit.changed(whole); } function fill(from, text) { var chars = clean(text); for (var i = 0; i < chars.length && from + i < length; i++) boxes[from + i].value = chars[i]; var next = Math.min(length - 1, from + chars.length); boxes[next].focus(); boxes[next].select(); post(); } clean(whole.value).slice(0, length).forEach(function (c, i) { boxes[i].value = c; }); hold(); boxes.forEach(function (box, i) { box.addEventListener('focus', function () { box.select(); }); box.addEventListener('input', function () { var chars = clean(box.value); box.value = ''; if (chars.length > 1) { fill(i, chars.join('')); return; } if (chars.length === 1) { box.value = chars[0]; if (i < length - 1) boxes[i + 1].focus(); } post(); }); box.addEventListener('keydown', function (event) { var to = null; if (event.key === 'Backspace' && box.value === '' && i > 0) { boxes[i - 1].value = ''; to = i - 1; post(); } else if (event.key === 'ArrowLeft') to = i - 1; else if (event.key === 'ArrowRight') to = i + 1; else if (event.key === 'Home') to = 0; else if (event.key === 'End') to = length - 1; else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey && !allowed.test(event.key)) { event.preventDefault(); return; } if (to === null) return; event.preventDefault(); to = Math.max(0, Math.min(length - 1, to)); boxes[to].focus(); }); box.addEventListener('paste', function (event) { var text = (event.clipboardData || window.clipboardData).getData('text'); if (!text) return; event.preventDefault(); fill(i, text); }); });});</script><div class="pad-input pad-input-otp" data-pad-input="otp" data-pad-label="Code" data-config="{&quot;length&quot;:6,&quot;letters&quot;:false}"><input type="text" class="pi-otp-whole" name="code" id="code" value="123456" maxlength="6" autocomplete="one-time-code" spellcheck="false" aria-label="Code"></div></form>
