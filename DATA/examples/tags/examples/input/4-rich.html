<form method="get"><script>/* The runtime of the PAD inputs (pad/subs/inputs/_lib/input.php writes it once per page). A kind's script registers itself - PadInputs.register('slider', function (frame, cfg, kit) { ... }) - and is started on every field of its kind: the ones on the page, and the ones a fragment, a live region or a script brings later. frame is the field's .pad-input element, cfg its data-config, kit the helpers below. The server wrote a native control that a form posts as it is; a kind's script makes more of it and keeps the posted control's value true - and says so with the input and change events a typed value sends, which the browser's checker of the rules (pad/subs/rules/assets/validate.js) listens to. */(function () { 'use strict'; if (window.PadInputs) return; var kinds = {}; var made = 0; function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; } var kit = { el: el, // A new id of the page, for an element a script adds: a listbox, an option, a box. id: function (base) { made++; return (base || 'pad-input') + '-js' + made; }, // The value changed as if typed: the form, the rules' checker and any listener hear it. changed: function (control) { control.dispatchEvent(new Event('input', { bubbles: true })); control.dispatchEvent(new Event('change', { bubbles: true })); }, // What the server wrote hidden for a script to show - a button, a popup's opener. show: function (root, selector) { var list = root.querySelectorAll(selector); for (var i = 0; i < list.length; i++) list[i].hidden = false; }, // A click outside the element - or the focus leaving it - closes what it opened. outside: function (root, close) { document.addEventListener('pointerdown', function (event) { if (!root.contains(event.target)) close(); }); root.addEventListener('focusout', function (event) { if (event.relatedTarget && !root.contains(event.relatedTarget)) close(); }); }, alue="5"><label class="pi-star" for="score-5"><span class="pi-hide">5 stars of 5</span></label></span><button type="button" class="pi-button pi-stars-clear" hidden="">Clear</button></fieldset><script>/* datepicker - the month over the date field: a dialog with the month's days as a grid, the way the WAI-ARIA date picker dialog is built. The field stays what the form posts, and the day chosen is written into it as 2026-10-31 - it says it changed, as a typed day does. The arrow keys walk the days, Page Up and Page Down the months (with Shift the years), Home and End the week; Enter or Space takes the day, Escape closes, and the focus goes back to the button that opened it. Days outside min= and max= cannot be chosen. The names of the months and the days are the browser's, in the page's language. */PadInputs.register('datepicker', function (frame, cfg, kit) { var field = frame.querySelector('input[type=date]'); var opener = frame.querySelector('.pi-date-open'); var anchor = frame.querySelector('.pi-anchor'); if (!field || !opener || !anchor) return; var lang = document.documentElement.lang || undefined; var first = cfg.weekstart === 'sunday' ? 0 : 1; var name = kit.label(frame); var monthName = new Intl.DateTimeFormat(lang, { month: 'long', year: 'numeric', timeZone: 'UTC' }); var dayName = new Intl.DateTimeFormat(lang, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); var shortDay = new Intl.DateTimeFormat(lang, { weekday: 'short', timeZone: 'UTC' }); var longDay = new Intl.DateTimeFormat(lang, { weekday: 'long', timeZone: 'UTC' }); // A day is a number of days since 1970-01-01, in UTC: no clock change in between. function parse(text) { var one = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text || ''); if (!one) return null; var day = Date.UTC(+one[1], +one[2] - 1, +one[3]) / 86400000; return iso(day) === text ? day : null; } function iso(day) { var d = new Date(day * 86400000); return String(d.getUTCFullYear()).padStart(4, '0') + '-' + Strin on', 'pi-button', 'Close'); close.type = 'button'; foot.appendChild(now); foot.appendChild(close); dialog.appendChild(head); dialog.appendChild(grid); dialog.appendChild(foot); anchor.appendChild(dialog); opener.setAttribute('aria-controls', dialog.id); opener.hidden = false; var focus = today(); function allowed(day) { var low = parse(field.min), high = parse(field.max); return (low === null || day >= low) && (high === null || day <= high); } function within(day) { var low = parse(field.min), high = parse(field.max); if (low !== null && day < low) return low; if (high !== null && day > high) return high; return day; } function draw(moveFocus) { var p = parts(focus); var start = Date.UTC(p.y, p.m, 1) / 86400000; var lead = (parts(start).w - first + 7) % 7; var chosen = parse(field.value), now = today(); title.textContent = monthName.format(start * 86400000); tbody.textContent = ''; var length = new Date(Date.UTC(p.y, p.m + 1, 0)).getUTCDate(); var rows = Math.ceil((lead + length) / 7); var day = start - lead; for (var row = 0; row < rows; row++) { var tr = kit.el('tr'); for (var col = 0; col < 7; col++, day++) { var td = kit.el('td'); var q = parts(day); if (q.m === p.m) { var button = kit.el('button', 'pi-cal-day', String(q.d)); button.type = 'button'; button.tabIndex = day === focus ? 0 : -1; button.setAttribute('data-day', String(day)); button.setAttribute('aria-label', dayName.format(day * 86400000)); if (day === chosen) { button.setAttribute('aria-pressed', 'true'); td.setAttribute('aria-selected', 'true'); } if (day === now) button.setAttribute('aria-current', 'date'); if (!allowed(day)) button.disabled = true; td.appendChild(button); } tr.appendChild(td); } tbody.appendChild(tr); } var low = parse(field.min), high = parse(field.max); back.disabled = low !== null && start - 1 < low; ahead.disabled = high !== null && start + length > high; now.disabled = !allowed(today()); if (moveFocus) { var target = tbody.querySelector('[data-day="' + focus + '"]'); if (targ () { hide(false); });});</script><div class="pad-input pad-input-datepicker" data-pad-input="datepicker" data-pad-label="Day" data-config="{&quot;weekstart&quot;:&quot;monday&quot;}"><label for="day">Day</label><div class="pi-anchor"><div class="pi-row"><input type="date" name="day" id="day" value=""><button type="button" class="pi-button pi-date-open" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose Day" hidden=""><svg width="16" height="16" viewbox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="11.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"></rect><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg></button></div></div></div></form>
