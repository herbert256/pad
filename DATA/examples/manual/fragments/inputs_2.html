<div class="pad-input pad-input-datepicker" data-pad-input="datepicker" data-pad-label="Arrival" data-config="{&quot;weekstart&quot;:&quot;monday&quot;}"><label for="arrival">Arrival</label><div class="pi-anchor"><div class="pi-row"><input type="date" name="arrival" id="arrival" value=""><button type="button" class="pi-button pi-date-open" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose Arrival" hidden=""><svg width="16" height="16" viewbox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="11.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"></rect><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg></button></div></div></div><script>/* timepicker - the times to choose from as a list under the time field: a listbox the arrow keys walk, Home and End to its ends, a typed digit to the first time it begins with; Enter takes the time, Escape closes and gives the focus back. The list starts at the field's time, or the last one before it. The field stays what the form posts; the browser's own list of the datalist is left out where this one is. */PadInputs.register('timepicker', function (frame, cfg, kit) { var field = frame.querySelector('input[type=time]'); var opener = frame.querySelector('.pi-time-open'); var anchor = frame.querySelector('.pi-anchor'); var slots = cfg.slots || []; if (!field || !opener || !anchor || !slots.length) return; field.removeAttribute('list'); var list = kit.el('ul', 'pi-popup pi-time-list'); list.id = kit.id((field.id || 'time') + '-times'); list.setAttribute('role', 'listbox'); list.setAttribute('aria-label', kit.label(frame) || 'Times'); list.tabIndex = -1; list.hidden = true; var options = slots.map(function (slot) { var li = kit.el('li', 'pi-time-option', slot); li.id = kit.id(list.id); li.setAttribute('role', 'option'); li.setAttribute('data-time', slot); li.setAttribute('aria-selected', 'false'); list.appendChild(li); return li; }); an else if (key === 'PageUp') activate(active - 6); else if (key === 'Enter' || key === ' ') take(active); else if (key === 'Escape') hide(true); else if (key === 'Tab') { hide(false); return; } else if (/^\d$/.test(key)) { for (var i = 1; i <= options.length; i++) { var at = (active + i) % options.length; if (options[at].getAttribute('data-time').charAt(0) === key || options[at].getAttribute('data-time').replace(/^0/, '').charAt(0) === key) { activate(at); break; } } } else return; event.preventDefault(); }); kit.outside(anchor, function () { hide(false); });});</script><div class="pad-input pad-input-timepicker" data-pad-input="timepicker" data-pad-label="Time" data-config="{&quot;slots&quot;:[&quot;00:00&quot;,&quot;00:15&quot;,&quot;00:30&quot;,&quot;00:45&quot;,&quot;01:00&quot;,&quot;01:15&quot;,&quot;01:30&quot;,&quot;01:45&quot;,&quot;02:00&quot;,&quot;02:15&quot;,&quot;02:30&quot;,&quot;02:45&quot;,&quot;03:00&quot;,&quot;03:15&quot;,&quot;03:30&quot;,&quot;03:45&quot;,&quot;04:00&quot;,&quot;04:15&quot;,&quot;04:30&quot;,&quot;04:45&quot;,&quot;05:00&quot;,&quot;05:15&quot;,&quot;05:30&quot;,&quot;05:45&quot;,&quot;06:00&quot;,&quot;06:15&quot;,&quot;06:30&quot;,&quot;06:45&quot;,&quot;07:00&quot;,&quot;07:15&quot;,&quot;07:30&quot;,&quot;07:45&quot;,&quot;08:00&quot;,&quot;08:15&quot;,&quot;08:30&quot;,&quot;08:45&quot;,&quot;09:00&quot;,&quot;09:15&quot;,&quot;09:30&quot;,&quot;09:45&quot;,&quot;10:00&quot;,&quot;10:15&quot;,&quot;10:30&quot;,&quot;10:45&quot;,&quot;11:00&quot;,&quot;11:15&quot;,&quot;11:30&quot;,&quot;11:45&quot;,&quot;12:00&quot;,&quot;12:15&quot;,&quot;12:30&quot;,&quot;12:45&quot;,&quot;13:00&quot;,&quot;13:15&quot;,&quot;13:30&quot;,&quot;13:45&quot;,&quot;14:00&quot;,&quot;14:15&quot;,&quot;14:30&quot;,&quot;14:45&quot;,&quot;15:00&quot;,&quot;15:15&quot;,&quot;15:30&quot;,&quot;15:45&quot;,&quot;16:00&quot;,&quot;16:15&quot;,&quot;16:30&quot;,&quot;16:45&quot;,&quot;17:00&quot;,&quot;17:15&quot;,&quot;17:30&quot;,&quot;17:45&quot;,&q 23:45"></option></datalist></div><script>/* colorpicker - the swatches and the code field beside the colour field, all three in step: a swatch chosen, a code typed - #rgb or #rrggbb - or a colour picked sets the other two, and the colour field, the one the form posts, says it changed. The swatch of the colour is pressed. The swatches are buttons in a group, the arrow keys move along them. */PadInputs.register('colorpicker', function (frame, cfg, kit) { var colour = frame.querySelector('input[type=color]'); var code = frame.querySelector('.pi-color-code'); var row = frame.querySelector('.pi-swatches'); if (!colour) return; var buttons = []; function full(text) { var one = String(text).trim().toLowerCase().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/); if (!one) return null; var hex = one[1]; return '#' + (hex.length === 3 ? hex.replace(/./g, '$&$&') : hex); } function mark() { buttons.forEach(function (button) { button.setAttribute('aria-pressed', button.getAttribute('data-colour') === colour.value ? 'true' : 'false'); }); } function set(value, from) { if (value === null) return; if (colour.value !== value) { colour.value = value; kit.changed(colour); } if (code && from !== code) code.value = value; mark(); } (cfg.swatches || []).forEach(function (one, i) { var button = kit.el('button', 'pi-swatch'); button.type = 'button'; button.setAttribute('data-colour', one); button.setAttribute('aria-label', one); button.title = one; button.tabIndex = i === 0 ? 0 : -1; button.style.background = one; button.addEventListener('click', function () { set(one); }); buttons.push(button); row.appendChild(button); }); // One tab stop for the row: the arrows move between the swatches, as in a toolbar. row.addEventListener('keydown', function (event) { var at = buttons.indexOf(document.activeElement); if (at < 0) return; var to = { ArrowRight: at + 1, ArrowDown: at + 1, ArrowLeft: at - 1, ArrowUp: at - 1, Home: 0, End: buttons.length - 1 }[event.key]; if (to === undefined) return; event.preventD
