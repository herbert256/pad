<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WASM - PAD</title>
  <!-- The static counterpart of _common's padFrame: shared styles and menu behavior,
       with the application registry and theme CSS supplied by php wasm/build.php. -->
  <link rel="stylesheet" href="../_common/pad.css">
  <link rel="stylesheet" href="../_common/brand.css">
  <link rel="stylesheet" href="../_common/editor.css">
  <link rel="stylesheet" href="editor.css">
  <script src="../_common/pad.js" defer></script>
  <script src="../_common/brand.js" defer></script>
  <!-- The PHP loader imports its .wasm binary as a module; map it to its URL. -->
  <script type="importmap">
  {
    "imports": {
      "https://cdn.jsdelivr.net/npm/@php-wasm/web-8-4@3.1.56/asyncify/8_4_25/php_8_4.wasm":
        "data:text/javascript,export default 'https://cdn.jsdelivr.net/npm/@php-wasm/web-8-4@3.1.56/asyncify/8_4_25/php_8_4.wasm';"
    }
  }
  </script>
  <script type="module" src="editor.js?v=4"></script>
</head>
<body class="frame frame-fill app-wasm">
  <aside class="frame-side">
    <div class="frame-brand">
      <div class="pad-brand pad-brand-frame">
        <a class="pad-brand-logo" href="../pad/" title="PAD home" aria-label="PAD home">&#123;&#125;</a>
        <details class="pad-brand-menu">
          <summary title="The PAD applications"><span class="pad-brand-name"><span class="pad-brand-pad">PAD </span><b>wasm</b></span><span data-icon="chevron-down"></span></summary>
          <nav class="pad-brand-apps" aria-label="PAD applications">
            <div class="pad-brand-columns" id="appMenu">
              <div class="pad-brand-group">
                <div class="pad-brand-head">Examples</div>
                <a href="../live/"><span><b>live</b><small>Run a page on this server</small></span></a>
              </div>
            </div>
          </nav>
        </details>
      </div>
    </div>
    <nav class="frame-nav" aria-label="WASM">
      <a href="./" aria-current="page"><span data-icon="code"></span>WASM</a>
    </nav>
  </aside>
  <main class="frame-main">
    <header class="frame-top">
      <h1>WASM: Runs with WASM in your browser</h1>
      <div class="frame-tools">
        <span class="playTools">
          <button type="submit" form="playForm" id="render" class="playRun" disabled>Render</button>
          <button type="submit" form="playForm" id="asSource" disabled>Show the HTML</button>
          <a id="toOther" class="toOther" href="../live/" title="The same template, data and PHP in the live application"><span data-icon="zap"></span>Open in live</a>
        </span>
        <div class="pad-themes">
          <label class="sr-only" for="wasmTheme">Theme</label>
          <select id="wasmTheme" disabled><option value="">Default</option></select>
        </div>
      </div>
    </header>
    <div class="frame-body">
      <form id="playForm" class="play">
        <div class="pane">
          <label for="source">Template</label>
          <textarea id="source" name="source" spellcheck="false" rows="14">&lt;h2&gt;{$title}&lt;/h2&gt;
&lt;ul&gt;
  {array:items}
    &lt;li&gt;{$name}{pad:if $stock eq 0} - sold out{/pad:if}&lt;/li&gt;
  {/array:items}
&lt;/ul&gt;
</textarea>
          <div class="dataHead"><label for="data" data-mode="data">Data - JSON, YAML, XML or CSV</label>
            <label for="php" data-mode="php" hidden>Data - PHP code</label>
            <button type="button" id="dataSwitch" hidden>Switch to PHP</button>
          </div>
          <input type="hidden" id="mode" value="data">
          <textarea id="data" name="data" data-mode="data" spellcheck="false" rows="10" placeholder="No data - the template has only what it sets itself">{
  "title": "Fruit",
  "items": [
    { "name": "Apple", "stock": 3 },
    { "name": "Pear",  "stock": 0 }
  ]
}
</textarea>
          <textarea id="php" name="php" data-mode="php" spellcheck="false" rows="10" hidden placeholder="No PHP - the template has only what it sets itself"></textarea>
          <p class="hint">Ctrl+Enter renders; the address bar always links to what is typed here.</p>
        </div>
        <div class="pane">
          <span class="caption">Output</span>
          <iframe id="output" title="Output" sandbox="allow-scripts"></iframe>
          <p id="status" class="hint" role="status" aria-live="polite">Loading PHP and PAD…</p>
          <noscript><p class="hint">JavaScript is needed to run PAD in your browser.</p></noscript>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
