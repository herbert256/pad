<div class="pad-input pad-input-taginput" data-pad-input="taginput" data-pad-label="Topics" data-config="{&quot;most&quot;:0}"><label for="topics">Topics</label><div class="pi-tags"><input type="text" name="topics" id="topics" value="pad, forms" autocomplete="off"></div></div><script>/* combobox - the WAI-ARIA combobox with a list that autocompletes: the field gets role="combobox" and the list under it role="listbox", the choice the arrow keys stand on is the field's aria-activedescendant - the focus stays in the field, typing goes on. The list holds the choices that contain what is typed - in any case, accents or not - at most 50, those that begin with it first, the matching part marked; it opens as the field is typed in, with Alt+Down or Down, and closes with Escape, a choice taken, or the focus leaving. Escape in a closed list empties the field. How many choices there are is said to a screen reader. The browser's own list of the datalist is left out where this one is. */PadInputs.register('combobox', function (frame, cfg, kit) { var field = frame.querySelector('.pi-anchor input[type=text]'); var anchor = frame.querySelector('.pi-anchor'); var said = frame.querySelector('.pi-combo-said'); var choices = cfg.choices || []; if (!field || !anchor || !choices.length) return; field.removeAttribute('list'); var list = kit.el('ul', 'pi-popup pi-combo-list'); list.id = kit.id((field.id || 'combo') + '-list'); list.setAttribute('role', 'listbox'); list.setAttribute('aria-label', kit.label(frame) || 'Choices'); list.hidden = true; anchor.appendChild(list); field.setAttribute('role', 'combobox'); field.setAttribute('aria-autocomplete', 'list'); field.setAttribute('aria-expanded', 'false'); field.setAttribute('aria-controls', list.id); function fold(text) { return String(text).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); } var folded = choices.map(fold); var shown = [], active = -1, timer = null; function say(text) { clearTimeout(timer); timer = setTimeout(function () { if (said) said.textContent = text; }, 400); } function option(text, at, typed) { var li = kit.el('li', 'pi-combo-option'); li.id = list.id + '-' + at; li.setAttribute('role', 'option'); li.setAttribute('aria-selected', 'false'); var found = typed ? fold(text).indexOf(typed) : -1; if (found >= 0 && fold(text).length === text.length) { li.appendChild(document.createTextNode(text.slice(0, found))); li.appendChild(kit.el('mark', '', text.slice(found, found + typed.length))); li.appendChild(document.createTextNode(text.slice(found + typed.length))); } else li.textContent = text; return li; } function fill() { var typed = fold(field.value.trim()); var starts = [], holds = []; folded.forEach(function (one, i) { if (!typed || one.indexOf(typed) === 0) starts.push(i); else if (one.indexOf(typed) > 0) holds.push(i); }); shown = starts.concat(holds).slice(0, 50); list.textContent = ''; shown.forEach(function (i, at) { list.appendChild(option(choices[i], at, typed)); }); active = -1; field.removeAttribute('aria-activedescendant'); return typed; } function open() { fill(); if (!shown.length) { close(); say('No choices hold what is typed'); return; } list.hidden = false; field.setAttribute('aria-expanded', 'true'); say(shown.length === 1 ? '1 choice' : shown.length + ' choices'); } function close() { list.hidden = true; field.setAttribute('aria-expanded', 'false'); field.removeAttribute('aria-activedescendant'); active = -1; } function activate(at) { var items = list.children; if (active >= 0 && items[active]) { items[active].classList.remove('is-active'); items[active].setAttribute('aria-selected', 'false'); } active = (at + shown.length) % shown.length; items[active].classList.add('is-active'); items[active].setAttribute('aria-selected', 'true'); field.setAttribute('aria-activedescendant', items[active].id); items[active].scrollIntoView({ block: 'nearest' }); } // A choice taken says the field changed, as typing does - and that is no typing that opens // the list again. var taking = false; function take(at) { field.value = choices[shown[at]]; close(); taking = true; kit.changed(field); taking = false; } field.addEventListener('input', function () { if (!taking) open(); }); field.addEventListener('keydown', function (event) { var key = event.key; if (key === 'ArrowDown') { event.preventDefault(); if (list.hidden) { open(); if (!event.altKey && shown.length) activate(0); } else if (shown.length) activate(active + 1); } else if (key === 'ArrowUp') { event.preventDefault(); if (list.hidden) { open(); if (shown.length) activate(shown.length - 1); } else if (shown.length) activate(active - 1); } else if (key === 'Enter') { if (!list.hidden && active >= 0) { event.preventDefault(); take(active); } } else if (key === 'Escape') { if (!list.hidden) { event.preventDefault(); close(); } else if (field.value !== '') { event.preventDefault(); field.value = ''; taking = true; kit.changed(field); taking = false; } } else if (key === 'Tab') close(); }); // A pointer chooses without the field losing the focus. list.addEventListener('mousedown', function (event) { event.preventDefault(); }); list.addEventListener('click', function (event) { var li = event.target.closest('.pi-combo-option'); if (li) { take(Array.prototype.indexOf.call(list.children, li)); field.focus(); } }); kit.outside(anchor, close); field.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== field) close(); }, 0); });});</script><div class="pad-input pad-input-combobox" data-pad-input="combobox" data-pad-label="City" data-config="{&quot;choices&quot;:[&quot;Amsterdam&quot;,&quot;Berlin&quot;,&quot;Paris&quot;]}"><label for="city">City</label><div class="pi-anchor"><input type="text" name="city" id="city" value="" list="city-choices" autocomplete="off"></div><datalist id="city-choices"><option value="Amsterdam"></option><option value="Berlin"></option><option value="Paris"></option></datalist></div><script>/* otp - a box per character over the one-time code. The text field the server wrote becomes the hidden field the form posts; the boxes - a group named by the field's label - take one character each, and the first box takes the field's id, so the label and the messages are its. A character typed moves the focus on, Backspace back - emptying the box before it when it is empty itself - the arrow keys, Home and End move along, and a code pasted or offered by the phone (autocomplete="one-time-code", on the first box) fills the boxes from where it lands - the boxes have no maxlength, so a code a phone puts in the first box whole is spread over them rather than cut to its first character. A character the code cannot hold is not taken. The checks the field carried - required, pattern=, minlength= - stay the code's: a hidden field is one the browser does not check, so the first box holds the code to them, with the browser's own message. */PadInputs.register('otp', function (frame, cfg, kit) { var whole = frame.querySelector('.pi-otp-whole'); if (!whole) return; var length = cfg.length || 6; var allowed = cfg.letters ? /[A-Za-z0-9]/ : /[0-9]/; var id = whole.id; var label = frame.querySelector('label[for="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); var invalid = whole.getAttribute('aria-invalid'); var described = whole.getAttribute('aria-describedby'); var group = kit.el('div', 'pi-otp-boxes'); group.setAttribute('role', 'group'); if (label) { if (!label.id) label.id = kit.id(id + '-label'); group.setAttribute('aria-labelledby', label.id); } else group.setAttribute('aria-label', kit.label(frame)); var boxes = []; for (var i = 0; i < length; i++) { var box = document.createElement('input'); box.type = 'text'; box.className = 'pi-otp-box'; box.setAttribute('inputmode', cfg.letters ? 'text' : 'numeric'); box.setAttribute('autocomplete', i === 0 ? 'one-time-code' : 'off'); box.setAttribute('aria-label', 'Character ' + (i + 1) + ' of ' + length); box.spellcheck = false; if (cfg.letters) box.setAttribute('autocapitalize', 'characters'); if (whole.disabled) box.disabled = true; boxes.push(box); group.appendChild(box); } // The first box is the field the label and the messages point at. whole.removeAttribute('id'); boxes[0].id = id; if (invalid) boxes.forEach(function (box) { box.setAttribute('aria-invalid', invalid); }); if (described) boxes[0].setAttribute('aria-describedby', described); whole.removeAttribute('aria-invalid'); whole.removeAttribute('aria-describedby'); whole.setAttribute('data-pad-shows', id); // The field's checks on a field of their own, outside the form, that the code is put in: // its answer - and the browser's message - is the first box's. A length is checked by the // browser only on what was typed, so minlength= is a pattern here. var probe = document.createElement('input'); probe.type = 'text'; probe.required = whole.required; var least = parseInt(whole.getAttribute('minlength'), 10); var shape = whole.getAttribute('pattern'); if (least > 0 || shape !== null) probe.pattern = (least > 0 ? '(?=[\\s\\S]{' + least + ',})' : '') + '(?:' + (shape !== null ? shape : '[\\s\\S]*') + ')'; if (whole.required) boxes[0].setAttribute('aria-required', 'true'); whole.type = 'hidden'; whole.parentNode.insertBefore(group, whole); function clean(text) { return Array.from(String(text)).filter(function (c) { return allowed.test(c); }).map(function (c) { return c.toUpperCase(); }); } function hold() { probe.value = whole.value; boxes[0].setCustomValidity(probe.checkValidity() ? '' : probe.validationMessage); } function post() { whole.value = boxes.map(function (box) { return box.value; }).join(''); hold(); kit.changed(whole); } function fill(from, text) { var chars = clean(text); for (var i = 0; i < chars.length && from + i < length; i++) boxes[from + i].value = chars[i]; var next = Math.min(length - 1, from + chars.length); boxes[next].focus(); boxes[next].select(); post(); } clean(whole.value).slice(0, length).forEach(function (c, i) { boxes[i].value = c; }); hold(); boxes.forEach(function (box, i) { box.addEventListener('focus', function () { box.select(); }); box.addEventListener('input', function () { var chars = clean(box.value); box.value = ''; if (chars.length > 1) { fill(i, chars.join('')); return; } if (chars.length === 1) { box.value = chars[0]; if (i < length - 1) boxes[i + 1].focus(); } post(); }); box.addEventListener('keydown', function (event) { var to = null; if (event.key === 'Backspace' && box.value === '' && i > 0) { boxes[i - 1].value = ''; to = i - 1; post(); } else if (event.key === 'ArrowLeft') to = i - 1; else if (event.key === 'ArrowRight') to = i + 1; else if (event.key === 'Home') to = 0; else if (event.key === 'End') to = length - 1; else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey && !allowed.test(event.key)) { event.preventDefault(); return; } if (to === null) return; event.preventDefault(); to = Math.max(0, Math.min(length - 1, to)); boxes[to].focus(); }); box.addEventListener('paste', function (event) { var text = (event.clipboardData || window.clipboardData).getData('text'); if (!text) return; event.preventDefault(); fill(i, text); }); });});</script><div class="pad-input pad-input-otp" data-pad-input="otp" data-pad-label="Code" data-config="{&quot;length&quot;:4,&quot;letters&quot;:false}"><label for="code">Code</label><input type="text" class="pi-otp-whole" name="code" id="code" value="" maxlength="4" autocomplete="one-time-code" spellcheck="false"></div>
