<section class="pad-game pad-game-hangman" id="pad-game-hangman-9b21f65a" data-pad-game="hangman" data-config="{&quot;words&quot;:[&quot;harbour&quot;,&quot;lighthouse&quot;],&quot;tries&quot;:6,&quot;name&quot;:&quot;Hangman&quot;}" aria-label="Hangman"><header class="pg-head"><strong class="pg-title">Hangman</strong></header><div class="pg-board"></div><div class="pg-bar"></div><noscript><p class="pg-noscript">This game is played in the browser and needs JavaScript.</p></noscript></section><script>/* The runtime of the PAD games (pad/games/_lib/game.php writes it once per page). A game's script registers itself - PadGames.register('memory', function (k, cfg) { ... }) - and is started on every board of its kind: the ones on the page, and the ones a fragment, a live region or a script brings later. k is the game's kit: its board, its status line and its bar, a random number seeded by seed= (the same games on every load) or by the browser, timers that stop with the game, and the end of a game, which the board carries as data-result="won" or "lost" and announces with a pad-game-end event. */(function () { 'use strict'; if (window.PadGames) return; var kinds = {}; // mulberry32: a small, fast generator whose numbers follow from the seed alone. function random(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; } function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; } function Kit(root, cfg) { this.root = root; this.cfg = cfg; this.board = root.querySelector('.pg-board'); this.bar = root.querySelector('.pg-bar'); this.statusEl = root.querySelector('.pg-status'); this.seed = (typeof cfg.seed === 'number') ? cfg.seed : Math.floor(Math.random() * 2147483647); this.rand = random(this.seed); this.tim
