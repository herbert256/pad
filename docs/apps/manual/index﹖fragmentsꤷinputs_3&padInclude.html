</style><script>/* The runtime of the PAD inputs (pad/inputs/_lib/input.php writes it once per page). A kind's
   script registers itself - PadInputs.register('slider', function (frame, cfg, kit) { ... })
   - and is started on every field of its kind: the ones on the page, and the ones a fragment,
   a live region or a script brings later. frame is the field's .pad-input element, cfg its
   data-config, kit the helpers below. The server wrote a native control that a form posts
   as it is; a kind's script makes more of it and keeps the posted control's value true -
   and says so with the input and change events a typed value sends, which the browser's
   checker of the rules (pad/rules/assets/validate.js) listens to. */

(function () {
  'use strict';

  if (window.PadInputs) return;

  var kinds = {};
  var made = 0;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  var kit = {
    el: el,

    // A new id of the page, for an element a script adds: a listbox, an option, a box.
    id: function (base) {
      made++;
      return (base || 'pad-input') + '-js' + made;
    },

    // The value changed as if typed: the form, the rules' checker and any listener hear it.
    changed: function (control) {
      control.dispatchEvent(new Event('input', { bubbles: true }));
      control.dispatchEvent(new Event('change', { bubbles: true }));
    },

    // What the server wrote hidden for a script to show - a button, a popup's opener.
    show: function (root, selector) {
      var list = root.querySelectorAll(selector);
      for (var i = 0; i < list.length; i++) list[i].hidden = false;
    },

    // A click outside the element - or the focus leaving it - closes what it opened.
    outside: function (root, close) {
      document.addEventListener('pointerdown', function (event) {
        if (!root.contains(event.target)) close();
      });
      root.addEventListener('focusout', function (event) {
        if (event.relatedTarget && !root.contains(event.relatedTarget)) close();
      });
    },

    // The text of a field's label, for a name a script gives a control it adds.
    label: function (frame) {
      return frame.getAttribute('data-pad-label') || '';
    }
  };

  function start(frame) {
    if (frame.padInputReady) return;
    var init = kinds[frame.getAttribute('data-pad-input')];
    if (!init) return;
    var cfg = {};
    try { cfg = JSON.parse(frame.getAttribute('data-config') || '{}') || {}; } catch (e) { cfg = {}; }
    frame.padInputReady = true;
    frame.classList.add('is-ready');
    init(frame, cfg, kit);
  }

  function scan(where) {
    var list = (where || document).querySelectorAll('.pad-input[data-pad-input]');
    for (var i = 0; i < list.length; i++) start(list[i]);
  }

  window.PadInputs = {
    register: function (name, init) { kinds[name] = init; scan(); },
    scan: scan,
    kit: kit
  };

  document.addEventListener('DOMContentLoaded', function () { scan(); });

  if (window.MutationObserver)
    new MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++)
        for (var j = 0; j < records[i].addedNodes.length; j++) {
          var n = records[i].addedNodes[j];
          if (n.nodeType === 1 && (n.matches('.pad-input') || n.querySelector('.pad-input'))) { scan(); return; }
        }
    }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script><script>/* taginput - chips over the comma list. The text field the server wrote gives its name to a
   hidden field, which holds the words joined with ', ' - what the form posts, the same text
   the field posted without the script - and becomes the field a word is typed in. Enter or a
   comma adds the word, a pasted list adds each of its words, leaving the field adds what was
   typed; Backspace in the empty field takes the last word back, and every chip has a button
   that takes it out. A word is in the list once, in the case it was first written in. What
   happens is said to a screen reader. */
PadInputs.register('taginput', function (frame, cfg, kit) {
  var box = frame.querySelector('.pi-tags input[type=text]');
  var wrap = frame.querySelector('.pi-tags');
  var said = frame.querySelector('.pi-tags-said');
  if (!box || !wrap) return;

  var words = [];
  var hidden = document.createElement('input');
  hidden.type = 'hidden';
  hidden.name = box.name;
  if (box.id) hidden.setAttribute('data-pad-shows', box.id);
  box.removeAttribute('name');
  box.value.split(',').forEach(function (one) { add(one, true); });
  box.value = '';

  var chips = kit.el('ul', 'pi-chips');
  chips.setAttribute('aria-label', kit.label(frame) || 'Words');
  wrap.insertBefore(chips, box);
  wrap.appendChild(hidden);

  function say(text) { if (said) said.textContent = text; }

  function sync(quiet) {
    hidden.value = words.join(', ');
    chips.textContent = '';
    words.forEach(function (word, i) {
      var li = kit.el('li', 'pi-chip');
      li.appendChild(kit.el('span', 'pi-chip-text', word));
      var x = kit.el('button', 'pi-chip-x', '×');
      x.type = 'button';
      x.setAttribute('aria-label', 'Remove ' + word);
      x.addEventListener('click', function () {
        words.splice(i, 1);
        sync();
        say(word + ' removed');
        box.focus();
      });
      li.appendChild(x);
      chips.appendChild(li);
    });
    chips.hidden = !words.length;
    if (!quiet) kit.changed(hidden);
  }

  function add(text, quiet) {
    var word = String(text).replace(/\s+/g, ' ').trim();
    if (!word) return false;
    var lower = word.toLowerCase();
    if (words.some(function (one) { return one.toLowerCase() === lower; })) { if (!quiet) say(word + ' is there already'); return false; }
    if (cfg.most && words.length >= cfg.most) { if (!quiet) say('No more than ' + cfg.most); return false; }
    words.push(word);
    if (!quiet) say(word + ' added');
    return true;
  }

  function take() {
    var parts = box.value.split(',');
    var added = false;
    parts.forEach(function (one) { if (add(one)) added = true; });
    box.value = '';
    if (added) sync();
  }

  box.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ',') {
      if (box.value.trim() !== '' || event.key === ',') event.preventDefault();
      take();
    } else if (event.key === 'Backspace' && box.value === '' && words.length) {
      var word = words.pop();
      sync();
      say(word + ' removed');
    }
  });

  box.addEventListener('input', function () {
    if (box.value.indexOf(',') >= 0) take();
  });

  box.addEventListener('change', function () {
    if (box.value.trim() !== '') take();
  });

  box.addEventListener('blur', function () { if (box.value.trim() !== '') take(); });

  // A click in the frame of chips puts the focus in the field, as in a text field.
  wrap.addEventListener('click', function (event) { if (event.target === wrap) box.focus(); });

  sync(true);
});
</script><div class="pad-input pad-input-taginput" data-pad-input="taginput" data-pad-label="Topics" data-config="{&quot;most&quot;:0}"><label for="topics">Topics</label><div class="pi-tags"><input type="text" name="topics" id="topics" value="pad, forms" autocomplete="off"></div><span class="pi-hide pi-tags-said" aria-live="polite"></span></div>

</style><script>/* combobox - the WAI-ARIA combobox with a list that autocompletes: the field gets
   role="combobox" and the list under it role="listbox", the choice the arrow keys stand on is
   the field's aria-activedescendant - the focus stays in the field, typing goes on. The list
   holds the choices that contain what is typed - in any case, accents or not - at most 50,
   those that begin with it first, the matching part marked; it opens as the field is typed
   in, with Alt+Down or Down, and closes with Escape, a choice taken, or the focus leaving.
   Escape in a closed list empties the field. How many choices there are is said to a screen
   reader. The browser's own list of the datalist is left out where this one is. */
PadInputs.register('combobox', function (frame, cfg, kit) {
  var field = frame.querySelector('.pi-anchor input[type=text]');
  var anchor = frame.querySelector('.pi-anchor');
  var said = frame.querySelector('.pi-combo-said');
  var choices = cfg.choices || [];
  if (!field || !anchor || !choices.length) return;

  field.removeAttribute('list');

  var list = kit.el('ul', 'pi-popup pi-combo-list');
  list.id = kit.id((field.id || 'combo') + '-list');
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-label', kit.label(frame) || 'Choices');
  list.hidden = true;
  anchor.appendChild(list);

  field.setAttribute('role', 'combobox');
  field.setAttribute('aria-autocomplete', 'list');
  field.setAttribute('aria-expanded', 'false');
  field.setAttribute('aria-controls', list.id);

  function fold(text) {
    return String(text).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  var folded = choices.map(fold);
  var shown = [], active = -1, timer = null;

  function say(text) {
    clearTimeout(timer);
    timer = setTimeout(function () { if (said) said.textContent = text; }, 400);
  }

  function option(text, at, typed) {
    var li = kit.el('li', 'pi-combo-option');
    li.id = list.id + '-' + at;
    li.setAttribute('role', 'option');
    li.setAttribute('aria-selected', 'false');
    var found = typed ? fold(text).indexOf(typed) : -1;
    if (found >= 0 && fold(text).length === text.length) {
      li.appendChild(document.createTextNode(text.slice(0, found)));
      li.appendChild(kit.el('mark', '', text.slice(found, found + typed.length)));
      li.appendChild(document.createTextNode(text.slice(found + typed.length)));
    } else li.textContent = text;
    return li;
  }

  function fill() {
    var typed = fold(field.value.trim());
    var starts = [], holds = [];
    folded.forEach(function (one, i) {
      if (!typed || one.indexOf(typed) === 0) starts.push(i);
      else if (one.indexOf(typed) > 0) holds.push(i);
    });
    shown = starts.concat(holds).slice(0, 50);
    list.textContent = '';
    shown.forEach(function (i, at) { list.appendChild(option(choices[i], at, typed)); });
    active = -1;
    field.removeAttribute('aria-activedescendant');
    return typed;
  }

  function open() {
    fill();
    if (!shown.length) { close(); say('No choices hold what is typed'); return; }
    list.hidden = false;
    field.setAttribute('aria-expanded', 'true');
    say(shown.length === 1 ? '1 choice' : shown.length + ' choices');
  }

  function close() {
    list.hidden = true;
    field.setAttribute('aria-expanded', 'false');
    field.removeAttribute('aria-activedescendant');
    active = -1;
  }

  function activate(at) {
    var items = list.children;
    if (active >= 0 && items[active]) { items[active].classList.remove('is-active'); items[active].setAttribute('aria-selected', 'false'); }
    active = (at + shown.length) % shown.length;
    items[active].classList.add('is-active');
    items[active].setAttribute('aria-selected', 'true');
    field.setAttribute('aria-activedescendant', items[active].id);
    items[active].scrollIntoView({ block: 'nearest' });
  }

  // A choice taken says the field changed, as typing does - and that is no typing that opens
  // the list again.
  var taking = false;

  function take(at) {
    field.value = choices[shown[at]];
    close();
    taking = true;
    kit.changed(field);
    taking = false;
  }

  field.addEventListener('input', function () { if (!taking) open(); });

  field.addEventListener('keydown', function (event) {
    var key = event.key;
    if (key === 'ArrowDown') {
      event.preventDefault();
      if (list.hidden) { open(); if (!event.altKey && shown.length) activate(0); }
      else if (shown.length) activate(active + 1);
    } else if (key === 'ArrowUp') {
      event.preventDefault();
      if (list.hidden) { open(); if (shown.length) activate(shown.length - 1); }
      else if (shown.length) activate(active - 1);
    } else if (key === 'Enter') {
      if (!list.hidden && active >= 0) { event.preventDefault(); take(active); }
    } else if (key === 'Escape') {
      if (!list.hidden) { event.preventDefault(); close(); }
      else if (field.value !== '') { event.preventDefault(); field.value = ''; taking = true; kit.changed(field); taking = false; }
    } else if (key === 'Tab') close();
  });

  // A pointer chooses without the field losing the focus.
  list.addEventListener('mousedown', function (event) { event.preventDefault(); });
  list.addEventListener('click', function (event) {
    var li = event.target.closest('.pi-combo-option');
    if (li) { take(Array.prototype.indexOf.call(list.children, li)); field.focus(); }
  });

  kit.outside(anchor, close);
  field.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== field) close(); }, 0); });
});
</script><div class="pad-input pad-input-combobox" data-pad-input="combobox" data-pad-label="City" data-config="{&quot;choices&quot;:[&quot;Amsterdam&quot;,&quot;Berlin&quot;,&quot;Paris&quot;]}"><label for="city">City</label><div class="pi-anchor"><input type="text" name="city" id="city" value="" list="city-choices" autocomplete="off"></div><datalist id="city-choices"><option value="Amsterdam"></option><option value="Berlin"></option><option value="Paris"></option></datalist><span class="pi-hide pi-combo-said" aria-live="polite"></span></div>
<style>.pad-input-otp .pi-otp-whole{width:calc(var(--pi-otp,6) * 1.2em + 2em);letter-spacing:.3em;font-variant-numeric:tabular-nums}
.pad-input-otp .pi-otp-boxes{display:inline-flex;gap:.4em}
.pad-input-otp .pi-otp-box{width:2.3em;height:2.6em;text-align:center;font-size:1.15em;font-weight:600;font-variant-numeric:tabular-nums;padding:0!important}
</style><script>/* otp - a box per character over the one-time code. The text field the server wrote becomes
   the hidden field the form posts; the boxes - a group named by the field's label - take one
   character each, and the first box takes the field's id, so the label and the messages are
   its. A character typed moves the focus on, Backspace back - emptying the box before it when
   it is empty itself - the arrow keys, Home and End move along, and a code pasted or offered
   by the phone (autocomplete="one-time-code", on the first box) fills the boxes from where it
   lands - the boxes have no maxlength, so a code a phone puts in the first box whole is
   spread over them rather than cut to its first character. A character the code cannot hold
   is not taken. */
PadInputs.register('otp', function (frame, cfg, kit) {
  var whole = frame.querySelector('.pi-otp-whole');
  if (!whole) return;
  var length = cfg.length || 6;
  var allowed = cfg.letters ? /[A-Za-z0-9]/ : /[0-9]/;
  var id = whole.id;
  var label = frame.querySelector('label[for="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
  var invalid = whole.getAttribute('aria-invalid');
  var described = whole.getAttribute('aria-describedby');

  var group = kit.el('div', 'pi-otp-boxes');
  group.setAttribute('role', 'group');
  if (label) {
    if (!label.id) label.id = kit.id(id + '-label');
    group.setAttribute('aria-labelledby', label.id);
  } else group.setAttribute('aria-label', kit.label(frame));

  var boxes = [];
  for (var i = 0; i < length; i++) {
    var box = document.createElement('input');
    box.type = 'text';
    box.className = 'pi-otp-box';
    box.setAttribute('inputmode', cfg.letters ? 'text' : 'numeric');
    box.setAttribute('autocomplete', i === 0 ? 'one-time-code' : 'off');
    box.setAttribute('aria-label', 'Character ' + (i + 1) + ' of ' + length);
    box.spellcheck = false;
    if (cfg.letters) box.setAttribute('autocapitalize', 'characters');
    if (whole.disabled) box.disabled = true;
    boxes.push(box);
    group.appendChild(box);
  }

  // The first box is the field the label and the messages point at.
  whole.removeAttribute('id');
  boxes[0].id = id;
  if (invalid) boxes.forEach(function (box) { box.setAttribute('aria-invalid', invalid); });
  if (described) boxes[0].setAttribute('aria-describedby', described);
  whole.removeAttribute('aria-invalid');
  whole.removeAttribute('aria-describedby');
  whole.setAttribute('data-pad-shows', id);
  whole.type = 'hidden';
  whole.parentNode.insertBefore(group, whole);

  function clean(text) {
    return Array.from(String(text)).filter(function (c) { return allowed.test(c); }).map(function (c) { return c.toUpperCase(); });
  }

  function post() {
    whole.value = boxes.map(function (box) { return box.value; }).join('');
    kit.changed(whole);
  }

  function fill(from, text) {
    var chars = clean(text);
    for (var i = 0; i < chars.length && from + i < length; i++) boxes[from + i].value = chars[i];
    var next = Math.min(length - 1, from + chars.length);
    boxes[next].focus();
    boxes[next].select();
    post();
  }

  clean(whole.value).slice(0, length).forEach(function (c, i) { boxes[i].value = c; });

  boxes.forEach(function (box, i) {
    box.addEventListener('focus', function () { box.select(); });

    box.addEventListener('input', function () {
      var chars = clean(box.value);
      box.value = '';
      if (chars.length > 1) { fill(i, chars.join('')); return; }
      if (chars.length === 1) {
        box.value = chars[0];
        if (i < length - 1) boxes[i + 1].focus();
      }
      post();
    });

    box.addEventListener('keydown', function (event) {
      var to = null;
      if (event.key === 'Backspace' && box.value === '' && i > 0) {
        boxes[i - 1].value = '';
        to = i - 1;
        post();
      } else if (event.key === 'ArrowLeft') to = i - 1;
      else if (event.key === 'ArrowRight') to = i + 1;
      else if (event.key === 'Home') to = 0;
      else if (event.key === 'End') to = length - 1;
      else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey && !allowed.test(event.key)) { event.preventDefault(); return; }
      if (to === null) return;
      event.preventDefault();
      to = Math.max(0, Math.min(length - 1, to));
      boxes[to].focus();
    });

    box.addEventListener('paste', function (event) {
      var text = (event.clipboardData || window.clipboardData).getData('text');
      if (!text) return;
      event.preventDefault();
      fill(i, text);
    });
