e="emptied" id="emptied-2" value="M"><label class="pi-seg" for="emptied-2">M</label></span><input type="hidden" name="padLists[]" value="emptied"></fieldset><script>/* treepicker - the radio buttons of a hierarchy made the WAI-ARIA tree view in a popup under a button that shows the path of the choice. The radios stay what the form posts: choosing an item checks its radio, which says it changed. The tree is one tab stop with the focus on one item at a time: ArrowDown and ArrowUp move along the open items, ArrowRight opens an item or goes to its first child, ArrowLeft closes it or goes to its parent, Home and End go to the first and the last, a letter goes to the next item starting with it, * opens every item beside the focused one, Enter or Space chooses an item - one that can be chosen - and closes the popup, the focus back on the button, Escape closes it. A click on an item's arrow opens or closes it, on its text chooses it. The button takes the field's id, so the messages of the rules and the browser's checker are its; a required tree left without a choice says so under the button. A reset of the form shows the choice it started with. */PadInputs.register('treepicker', function (frame, cfg, kit) { var list = frame.querySelector('.pi-tree-list'); var opener = frame.querySelector('.pi-tree-open'); var anchor = frame.querySelector('.pi-anchor'); var legend = frame.querySelector('legend'); if (!list || !opener || !anchor) return; var radios = Array.prototype.slice.call(list.querySelectorAll('input[type=radio]')); var pathText = opener.querySelector('.pi-tree-path'); var choose = cfg.choose || 'Choose'; var ids = 0; // The button is the field now: the first radio's id, its message and its state are its. var first = radios[0]; if (first && first.id) { var fieldId = first.id; var firstLabel = list.querySelector('label[for="' + (window.CSS && CSS.escape ? CSS.escape(fieldId) : fieldId) + '"]'); first.id = fieldId + '-1'; if (firstLabel) firstLabel.htmlFor = first.id; open
