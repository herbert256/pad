t.target)) close(); }); root.addEventListener('focusout', function (event) { if (event.relatedTarget && !root.contains(event.relatedTarget)) close(); }); }, // The text of a field's label, for a name a script gives a control it adds. label: function (frame) { return frame.getAttribute('data-pad-label') || ''; } }; function start(frame) { if (frame.padInputReady) return; var init = kinds[frame.getAttribute('data-pad-input')]; if (!init) return; var cfg = {}; try { cfg = JSON.parse(frame.getAttribute('data-config') || '{}') || {}; } catch (e) { cfg = {}; } frame.padInputReady = true; frame.classList.add('is-ready'); init(frame, cfg, kit); } function scan(where) { var list = (where || document).querySelectorAll('.pad-input[data-pad-input]'); for (var i = 0; i < list.length; i++) start(list[i]); } window.PadInputs = { register: function (name, init) { kinds[name] = init; scan(); }, scan: scan, kit: kit }; document.addEventListener('DOMContentLoaded', function () { scan(); }); if (window.MutationObserver) new MutationObserver(function (records) { for (var i = 0; i < records.length; i++) for (var j = 0; j < records[i].addedNodes.length; j++) { var n = records[i].addedNodes[j]; if (n.nodeType === 1 && (n.matches('.pad-input') || n.querySelector('.pad-input'))) { scan(); return; } } }).observe(document.documentElement, { childList: true, subtree: true });})();</script><fieldset class="pad-input pad-input-segmented" data-pad-input="segmented" data-pad-label="Size"><legend>Size</legend><span class="pi-segs"><input type="radio" class="pi-seg-input" name="size" id="size" value="S" checked><label class="pi-seg" for="size">S</label><input type="radio" class="pi-seg-input" name="size" id="size-2" value="M"><label class="pi-seg" for="size-2">M</label><input type="radio" class="pi-seg-input" name="size" id="size-3" value="L"><label class="pi-seg" for="size-3">L</label></span><input type="hidden" name="padLists[]" value="size"></fieldset></form><form method="post"><input type="hidden
