l-count').textContent = count; heap.textContent = ''; for (var i = 0; i < Math.min(count, 15); i++) heap.appendChild(k.el('span', 'mcl-seed')); b.setAttribute('aria-label', whose(side(h)) + ' house ' + number(h) + ', ' + plural(count, 'seed')); var playable = !busy && !k.over() && mine && legal({ pits: pits, store: store }, turn).indexOf(h) >= 0; b.setAttribute('aria-disabled', playable ? 'false' : 'true'); b.classList.toggle('is-playable', playable); } function drawStores() { [0, 1].forEach(function (p) { stores[p].querySelector('b').textContent = store[p]; stores[p].setAttribute('aria-label', who(p) + ': ' + plural(store[p], 'seed') + ' captured'); }); } function draw() { for (var h = 0; h < 12; h++) drawHouse(h, pits[h]); drawStores(); } function key() { return pits.join(',') + '/' + turn; } function finish(s, round) { pits = s.pits; store = s.store; draw(); var a = store[0], z = store[1], why = round ? 'The seeds only go round - each side takes what is on its own. ' : ''; if (cfg.two) return k.won(why + (a === z ? 'A draw, ' + a + ' each.' : (a > z ? 'South' : 'North') + ' wins, ' + Math.max(a, z) + ' to ' + Math.min(a, z) + '.')); var mine = store[0], theirs = store[1]; if (mine > theirs) k.won(why + 'You win, ' + mine + ' seeds to ' + theirs + '!'); else if (mine < theirs) k.lost(why + 'The computer wins, ' + theirs + ' seeds to ' + mine + '.'); else k.won(why + 'A draw, ' + mine + ' seeds each.'); } // A turn: the seeds sown one house at a time - at once under reduced motion - then the // capture, then the next player, or the end. function play(h, then) { var p = turn, n = pits[h], move = sow({ pits: pits, store: store }, h), shown = pits.slice(), step = 0; busy = true; draw(); houses.forEach(function (b) { b.classList.remove('is-from', 'is-last', 'is-taken'); }); houses[h].classList.add('is-from'); shown[h] = 0; drawHouse(h, 0); function next() { if (step < move.path.length && !reduced) { var x = move.path[step++]; shown[x]++; drawHouse(x, shown[x]); return
