<form method="post"><input type="hidden" name="padCsrfToken" value="ded79933c52fb5d3bb80e7d67b1005d6cb6f62b665d4324b415359500db2a025"><input type="hidden" name="padForm" value="g"><script>/* The runtime of the PAD inputs (pad/subs/inputs/_lib/input.php writes it once per page). A kind's script registers itself - PadInputs.register('slider', function (frame, cfg, kit) { ... }) - and is started on every field of its kind: the ones on the page, and the ones a fragment, a live region or a script brings later. frame is the field's .pad-input element, cfg its data-config, kit the helpers below. The server wrote a native control that a form posts as it is; a kind's script makes more of it and keeps the posted control's value true - and says so with the input and change events a typed value sends, which the browser's checker of the rules (www/assets/rules/validate.js) listens to. */(function () { 'use strict'; if (window.PadInputs) return; var kinds = {}; var made = 0; function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; } var kit = { el: el, // A new id of the page, for an element a script adds: a listbox, an option, a box. id: function (base) { made++; return (base || 'pad-input') + '-js' + made; }, // The value changed as if typed: the form, the rules' checker and any listener hear it. changed: function (control) { control.dispatchEvent(new Event('input', { bubbles: true })); control.dispatchEvent(new Event('change', { bubbles: true })); }, // What the server wrote hidden for a script to show - a button, a popup's opener. show: function (root, selector) { var list = root.querySelectorAll(selector); for (var i = 0; i < list.length; i++) list[i].hidden = false; }, // A click outside the element - or the focus leaving it - closes what it opened. outside: function (root, close) { document.addEventListener('pointerdown', function (event) { if (!root.contains(event.target)) close(); }); root.addEventListener('focusout', function (event) { if (event.relatedTarget && !root.contains(event.relatedTarget)) close(); }); }, // The text of a field's label, for a name a script gives a control it adds. label: function (frame) { return frame.getAttribute('data-pad-label') || ''; } }; function start(frame) { if (frame.padInputReady) return; var init = kinds[frame.getAttribute('data-pad-input')]; if (!init) return; var cfg = {}; try { cfg = JSON.parse(frame.getAttribute('data-config') || '{}') || {}; } catch (e) { cfg = {}; } frame.padInputReady = true; frame.classList.add('is-ready'); init(frame, cfg, kit); } function scan(where) { var list = (where || document).querySelectorAll('.pad-input[data-pad-input]'); for (var i = 0; i < list.length; i++) start(list[i]); } window.PadInputs = { register: function (name, init) { kinds[name] = init; scan(); }, scan: scan, kit: kit }; document.addEventListener('DOMContentLoaded', function () { scan(); }); if (window.MutationObserver) new MutationObserver(function (records) { for (var i = 0; i < records.length; i++) for (var j = 0; j < records[i].addedNodes.length; j++) { var n = records[i].addedNodes[j]; if (n.nodeType === 1 && (n.matches('.pad-input') || n.querySelector('.pad-input'))) { scan(); return; } } }).observe(document.documentElement, { childList: true, subtree: true });})();</script><script>/* rangeslider - the two ranges of a lower and an upper number laid on one track, the part between them filled. Each stays the native range the form posts - a WAI-ARIA slider of its own, reached with Tab and moved with the arrow keys, Page Up and Page Down, Home and End, named by its label (From, To) in the group of the legend - and neither passes the other: the lower stops at the upper, the upper at the lower. What each holds is said with its unit (aria-valuetext) and shown above the track as one line; a press on the track moves the nearer thumb there. A reset of the form brings the two it started with back. */PadInputs.register('rangeslider', function (frame, cfg, kit) { var track = frame.querySelector('.pi-range-track'); var from = frame.querySelector('.pi-range-from input[type=range]'); var to = frame.querySelector('.pi-range-to input[type=range]'); var said = frame.querySelector('.pi-range-said'); if (!track || !from || !to) return; var unit = cfg.unit || ''; var ends = [from, to]; var outs = ends.map(function (range) { var out = range.id ? frame.querySelector('output[for="' + (window.CSS && CSS.escape ? CSS.escape(range.id) : range.id) + '"]') : null; if (out) out.hidden = false; return out; }); var rail = kit.el('div', 'pi-range-rail'); rail.setAttribute('aria-hidden', 'true'); rail.appendChild(kit.el('div', 'pi-range-fill')); track.insertBefore(rail, track.firstChild); if (said) { said.setAttribute('aria-hidden', 'true'); said.hidden = false; } function low() { return parseFloat(from.min) || 0; } function high() { var max = parseFloat(from.max); return isNaN(max) ? 100 : max; } function part(range) { var span = high() - low(); return span > 0 ? Math.min(1, Math.max(0, (parseFloat(range.value) - low()) / span)) : 0; } function shown(range) { return range.value + unit; } // The fill and what is said follow the two; the lower thumb lies on top in the upper half // of the track, so two thumbs at the top can still be parted - and the upper in the lower. function sync() { var a = part(from), b = part(to); track.style.setProperty('--pi-lo', String(Math.min(a, b))); track.style.setProperty('--pi-hi', String(Math.max(a, b))); ends.forEach(function (range, i) { range.setAttribute('aria-valuetext', shown(range)); if (outs[i]) outs[i].textContent = shown(range); }); if (said) said.textContent = shown(from) + ' – ' + shown(to); from.classList.toggle('is-top', a > 0.5); } from.addEventListener('input', function () { if (parseFloat(from.value) > parseFloat(to.value)) from.value = to.value; sync(); }); to.addEventListener('input', function () { if (parseFloat(to.value) < parseFloat(from.value)) to.value = from.value; sync(); }); // A press on the track: the nearer thumb goes there, on a step of the range. rail.addEventListener('pointerdown', function (event) { if (from.disabled || to.disabled) return; var box = rail.getBoundingClientRect(); var at = box.width > 0 ? Math.min(1, Math.max(0, (event.clientX - box.left) / box.width)) : 0; var step = parseFloat(from.step) || 0; var value = low() + at * (high() - low()); if (step > 0) value = low() + Math.round((value - low()) / step) * step; var near = Math.abs(value - parseFloat(from.value)) <= Math.abs(value - parseFloat(to.value)) && value <= parseFloat(to.value) ? from : to; if (near === to && value < parseFloat(from.value)) near = from; near.value = String(value); near.dispatchEvent(new Event('input', { bubbles: true })); near.dispatchEvent(new Event('change', { bubbles: true })); near.focus(); event.preventDefault(); }); // Two ends that come crossed - refilled from a post made without the script - are put in // order: the first step of the upper end jumped it onto the lower. function order() { if (parseFloat(from.value) > parseFloat(to.value)) { var lower = to.value; to.value = from.value; from.value = lower; } sync(); } if (from.form) from.form.addEventListener('reset', function () { setTimeout(order, 0); }); order();});</script><fieldset class="pad-input pad-input-rangeslider" data-pad-input="rangeslider" data-pad-label="Price" data-config="{&quot;unit&quot;:&quot;&quot;}"><legend>Price</legend><div class="pi-range-said" hidden=""></div><div class="pi-range-track"><div class="pi-range-end pi-range-from"><label for="price_from">From</label><input type="range" name="price_from" id="price_from" min="0" max="500" step="1" value="100" aria-valuetext="100"><output class="pi-range-out" for="price_from" hidden="">100</output></div><div class="pi-range-end pi-range-to"><label for="price_to">To</label><input type="range" name="price_to" id="price_to" min="0" max="500" step="1" value="400"
