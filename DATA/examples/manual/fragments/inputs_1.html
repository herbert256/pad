<div class="pad-input pad-input-slider" data-pad-input="slider" data-pad-label="Volume" data-config="{&quot;unit&quot;:&quot;%&quot;}"><label for="volume">Volume</label><div class="pi-row pi-slider-row"><div class="pi-slider-track"><input type="range" name="volume" id="volume" min="0" max="100" step="1" value="50" aria-valuetext="50%"><div class="pi-slider-ends pi-muted" aria-hidden="true"><span>0%</span><span>100%</span></div></div><output class="pi-slider-out" for="volume">50%</output></div></div><script>/* stars - the button that takes a rating back, for a field that is not required: a radio group once chosen cannot be emptied otherwise. It shows while a star is chosen. */PadInputs.register('stars', function (frame, cfg, kit) { var radios = frame.querySelectorAll('.pi-star-input'); var clear = frame.querySelector('.pi-stars-clear'); if (!radios.length || !clear || !cfg.clear) return; var name = kit.label(frame); clear.setAttribute('aria-label', 'Clear ' + (name || 'the rating')); function chosen() { for (var i = 0; i < radios.length; i++) if (radios[i].checked) return radios[i]; return null; } function sync() { clear.hidden = !chosen(); } frame.addEventListener('change', sync); clear.addEventListener('click', function () { var one = chosen(); if (!one) return; one.checked = false; sync(); kit.changed(radios[0]); radios[0].focus(); }); sync();});</script><fieldset class="pad-input pad-input-stars" data-pad-input="stars" data-pad-label="Your rating" data-config="{&quot;max&quot;:5,&quot;clear&quot;:true}"><legend>Your rating</legend><span class="pi-stars"><input type="radio" class="pi-star-input" name="score" id="score" value="1"><label class="pi-star" for="score"><span class="pi-hide">1 star of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-2" value="2"><label class="pi-star" for="score-2"><span class="pi-hide">2 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-3" value="3"><label class="pi-star" for="score-3"><span class="pi-hide">3 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-4" value="4"><label class="pi-star" for="score-4"><span class="pi-hide">4 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-5" value="5"><label class="pi-star" for="score-5"><span class="pi-hide">5 stars of 5</span></label></span><button type="button" class="pi-button pi-stars-clear" hidden="">Clear</button></fieldset><div class="pad-input pad-input-toggle" data-pad-input="toggle" data-pad-label="Send me the newsletter"><div class="pi-row pi-toggle-row"><label for="news">Send me the newsletter</label><input type="hidden" name="news" value="0"><input type="checkbox" role="switch" name="news" id="news" value="1" checked></div></div>
