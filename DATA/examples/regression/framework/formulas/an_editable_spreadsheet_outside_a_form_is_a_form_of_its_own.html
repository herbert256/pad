<div class="pad-sheet" data-sheet="loan"><form method="post" class="pad-sheet-form"><table class="pad-sheet-table"><caption>A loan</caption><thead><tr><td class="pad-sheet-corner"></td><th scope="col">A</th><th scope="col">B</th></tr></thead><tbody><tr><th scope="row">1</th><td>Amount</td><td class="num in"><input name="padSheet[loan][B1]" value="10000" aria-label="B1, Amount" autocomplete="off"></td></tr><tr><th scope="row">2</th><td>Rate</td><td class="num in"><input name="padSheet[loan][B2]" value="5%" aria-label="B2, Rate" autocomplete="off"></td></tr><tr><th scope="row">3</th><td>Years</td><td class="num in"><input name="padSheet[loan][B3]" value="3" aria-label="B3, Years" autocomplete="off"></td></tr><tr><th scope="row">4</th><td>Payment</td><td class="num fx" title="=ROUND(PMT(B2/12,B3*12,-B1),2)" data-formula="=ROUND(PMT(B2/12,B3*12,-B1),2)" data-value="299.71">299.71</td></tr><tr><th scope="row">5</th><td>Fixed</td><td class="bool in"><input name="padSheet[loan][B5]" value="TRUE" aria-label="B5, Fixed" autocomplete="off"></td></tr></tbody></table><button type="submit" class="pad-sheet-recalc">Recalculate</button></form></div>
