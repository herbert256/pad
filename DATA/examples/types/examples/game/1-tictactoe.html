<section class="pad-game pad-game-tictactoe" id="pad-game-tictactoe-34eb1ddb" data-pad-game="tictactoe" data-config="{&quot;opens&quot;:&quot;you&quot;,&quot;two&quot;:false,&quot;name&quot;:&quot;Tic-tac-toe&quot;}" aria-label="Tic-tac-toe"><header class="pg-head"><strong class="pg-title">Tic-tac-toe</strong></header><div class="pg-board"></div><div class="pg-bar"></div><noscript><p class="pg-noscript">This game is played in the browser and needs JavaScript.</p></noscript></section><script>/* The runtime of the PAD games (pad/games/_lib/game.php writes it once per page). A game's script registers itself - PadGames.register('memory', function (k, cfg) { ... }) - and is started on every board of its kind: the ones on the page, and the ones a fragment, a live region or a script brings later. k is the game's kit: its board, its status line and its bar, a random number seeded by seed= (the same games on every load) or by the browser, timers that stop with the game, and the end of a game, which the board carries as data-result="won" or "lost" and announces with a pad-game-end event. */(function () { 'use strict'; if (window.PadGames) return; var kinds = {}; // mulberry32: a small, fast generator whose numbers follow from the seed alone. function random(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; } function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; } function Kit(root, cfg) { this.root = root; this.cfg = cfg; this.board = root.querySelector('.pg-board'); this.bar = root.querySelector('.pg-bar'); this.statusEl = root.querySelector('.pg-status'); this.seed = (typeof cfg.seed === 'number') ? cfg.seed : Math.floor(Math.random() * 2147483647); this.rand = random(this.seed); this.timers = []; addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true }); board.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp')); }); } }; function start(root) { if (root.padGameKit) return; var init = kinds[root.getAttribute('data-pad-game')]; if (!init) return; var cfg = {}; try { cfg = JSON.parse(root.getAttribute('data-config') || '{}') || {}; } catch (e) { cfg = {}; } var kit = new Kit(root, cfg); root.padGameKit = kit; root.classList.add('is-ready'); init(kit, cfg); } // The games of the page, or of a part of it - and of the open shadow roots in it: a game in // a web component's {shadow}, which the document's own querySelectorAll does not see into. // A shadow root found is watched for games that come, as the page is. function scan(where) { where = where || document; var list = where.querySelectorAll('.pad-game[data-pad-game]'); for (var i = 0; i < list.length; i++) start(list[i]); var all = where.querySelectorAll('*'); for (var j = 0; j < all.length; j++) if (all[j].shadowRoot) { watch(all[j].shadowRoot); scan(all[j].shadowRoot); } } window.PadGames = { register: function (name, init) { kinds[name] = init; scan(); }, scan: scan, random: random, el: el }; document.addEventListener('DOMContentLoaded', function () { scan(); }); var watcher = window.MutationObserver ? new MutationObserver(function (records) { for (var i = 0; i < records.length; i++) for (var j = 0; j < records[i].addedNodes.length; j++) { var n = records[i].addedNodes[j]; if (n.nodeType === 1 && (n.matches('.pad-game') || n.querySelector('.pad-game') || n.shadowRoot)) { scan(); return; } } }) : null; if (watcher) watcher.observe(document.documentElement, { childList: true, su cfg.two ? turn + ' to play' : 'Your turn - you are X'); } function newGame() { k.fresh(); board = ['', '', '', '', '', '', '', '', '']; grid = k.el('div', 'ttt-grid'); grid.setAttribute('role', 'grid'); cells = board.map(function (_, i) { var c = k.el('button', 'ttt-cell'); c.type = 'button'; c.setAttribute('aria-label', 'square ' + (i + 1) + ', empty'); c.addEventListener('click', function () { if (!c.disabled && (cfg.two || turn === 'X')) place(i); }); grid.appendChild(c); return c; }); k.board.appendChild(grid); turn = 'X'; if (!cfg.two && cfg.opens === 'computer') { turn = 'O'; k.status('The computer opens...'); k.later(computer, 350); } else k.status(cfg.two ? 'X to play' : 'Your turn - you are X'); } k.button('New game', newGame); newGame();});</script>
