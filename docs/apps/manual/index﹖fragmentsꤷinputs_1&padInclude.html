</style><script>/* The runtime of the PAD inputs (pad/inputs/_lib/input.php writes it once per page). A kind's
   script registers itself - PadInputs.register('slider', function (frame, cfg, kit) { ... })
   - and is started on every field of its kind: the ones on the page, and the ones a fragment,
   a live region or a script brings later. frame is the field's .pad-input element, cfg its
   data-config, kit the helpers below. The server wrote a native control that a form posts
   as it is; a kind's script makes more of it and keeps the posted control's value true -
   and says so with the input and change events a typed value sends, which the browser's
   checker of the rules (pad/rules/assets/validate.js) listens to. */

(function () {
  'use strict';

  if (window.PadInputs) return;

  var kinds = {};
  var made = 0;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  var kit = {
    el: el,

    // A new id of the page, for an element a script adds: a listbox, an option, a box.
    id: function (base) {
      made++;
      return (base || 'pad-input') + '-js' + made;
    },

    // The value changed as if typed: the form, the rules' checker and any listener hear it.
    changed: function (control) {
      control.dispatchEvent(new Event('input', { bubbles: true }));
      control.dispatchEvent(new Event('change', { bubbles: true }));
    },

    // What the server wrote hidden for a script to show - a button, a popup's opener.
    show: function (root, selector) {
      var list = root.querySelectorAll(selector);
      for (var i = 0; i < list.length; i++) list[i].hidden = false;
    },

    // A click outside the element - or the focus leaving it - closes what it opened.
    outside: function (root, close) {
      document.addEventListener('pointerdown', function (event) {
        if (!root.contains(event.target)) close();
      });
      root.addEventListener('focusout', function (event) {
        if (event.relatedTarget && !root.contains(event.relatedTarget)) close();
      });
    },

    // The text of a field's label, for a name a script gives a control it adds.
    label: function (frame) {
      return frame.getAttribute('data-pad-label') || '';
    }
  };

  function start(frame) {
    if (frame.padInputReady) return;
    var init = kinds[frame.getAttribute('data-pad-input')];
    if (!init) return;
    var cfg = {};
    try { cfg = JSON.parse(frame.getAttribute('data-config') || '{}') || {}; } catch (e) { cfg = {}; }
    frame.padInputReady = true;
    frame.classList.add('is-ready');
    init(frame, cfg, kit);
  }

  function scan(where) {
    var list = (where || document).querySelectorAll('.pad-input[data-pad-input]');
    for (var i = 0; i < list.length; i++) start(list[i]);
  }

  window.PadInputs = {
    register: function (name, init) { kinds[name] = init; scan(); },
    scan: scan,
    kit: kit
  };

  document.addEventListener('DOMContentLoaded', function () { scan(); });

  if (window.MutationObserver)
    new MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++)
        for (var j = 0; j < records[i].addedNodes.length; j++) {
          var n = records[i].addedNodes[j];
          if (n.nodeType === 1 && (n.matches('.pad-input') || n.querySelector('.pad-input'))) { scan(); return; }
        }
    }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script><script>/* slider - the value beside the range, and the value a screen reader says, as it moves. */
PadInputs.register('slider', function (frame, cfg) {
  var range = frame.querySelector('input[type=range]');
  var out = frame.querySelector('.pi-slider-out');
  if (!range) return;
  function say() {
    var text = range.value + (cfg.unit || '');
    if (out) out.textContent = text;
    range.setAttribute('aria-valuetext', text);
  }
  range.addEventListener('input', say);
  say();
});
</script><div class="pad-input pad-input-slider" data-pad-input="slider" data-pad-label="Volume" data-config="{&quot;unit&quot;:&quot;%&quot;}"><label for="volume">Volume</label><div class="pi-row pi-slider-row"><div class="pi-slider-track"><input type="range" name="volume" id="volume" min="0" max="100" step="1" value="50" aria-valuetext="50%"><div class="pi-slider-ends pi-muted" aria-hidden="true"><span>0%</span><span>100%</span></div></div><output class="pi-slider-out" for="volume">50%</output></div></div>

</style><script>/* stars - the button that takes a rating back, for a field that is not required: a radio
   group once chosen cannot be emptied otherwise. It shows while a star is chosen. */
PadInputs.register('stars', function (frame, cfg, kit) {
  var radios = frame.querySelectorAll('.pi-star-input');
  var clear = frame.querySelector('.pi-stars-clear');
  if (!radios.length || !clear || !cfg.clear) return;
  var name = kit.label(frame);
  clear.setAttribute('aria-label', 'Clear ' + (name || 'the rating'));
  function chosen() {
    for (var i = 0; i < radios.length; i++) if (radios[i].checked) return radios[i];
    return null;
  }
  function sync() { clear.hidden = !chosen(); }
  frame.addEventListener('change', sync);
  clear.addEventListener('click', function () {
    var one = chosen();
    if (!one) return;
    one.checked = false;
    sync();
    kit.changed(radios[0]);
    radios[0].focus();
  });
  sync();
});
</script><fieldset class="pad-input pad-input-stars" data-pad-input="stars" data-pad-label="Your rating" data-config="{&quot;max&quot;:5,&quot;clear&quot;:true}"><legend>Your rating</legend><span class="pi-stars"><input type="radio" class="pi-star-input" name="score" id="score" value="1"><label class="pi-star" for="score"><span class="pi-hide">1 star of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-2" value="2"><label class="pi-star" for="score-2"><span class="pi-hide">2 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-3" value="3"><label class="pi-star" for="score-3"><span class="pi-hide">3 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-4" value="4"><label class="pi-star" for="score-4"><span class="pi-hide">4 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-5" value="5"><label class="pi-star" for="score-5"><span class="pi-hide">5 stars of 5</span></label></span><button type="button" class="pi-button pi-stars-clear" hidden>Clear</button></fieldset>
