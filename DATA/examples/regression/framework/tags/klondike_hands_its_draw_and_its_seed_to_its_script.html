s.waste.length ? [s.waste[s.waste.length - 1]] : []; if (from.where === 'home') { var h = s.home[from.at]; return h.length ? [h[h.length - 1]] : []; } return s.piles[from.at].slice(from.index).map(function (x) { return x[0]; }); } function take(from, n) { if (from.where === 'waste') s.waste.pop(); else if (from.where === 'home') s.home[from.at].pop(); else { var pile = s.piles[from.at]; pile.splice(pile.length - n, n); if (pile.length && !pile[pile.length - 1][1]) pile[pile.length - 1][1] = true; } } function remember() { history.push(copy(s)); if (history.length > 500) history.shift(); } // A move of what from holds to a foundation or a pile - FALSE when the rules forbid it. function move(from, to) { var list = cards(from), c = list[0]; if (c === undefined) return false; if (to.where === 'home') { if (list.length !== 1 || to.at !== suit(c) || !homeTakes(c)) return false; } else if (to.where === 'pile') { if (from.where === 'pile' && from.at === to.at) return false; if (!pileTakes(to.at, c)) return false; } else return false; remember(); var turned = from.where === 'pile' && from.index > 0 && !s.piles[from.at][from.index - 1][1]; take(from, list.length); if (to.where === 'home') s.home[to.at].push(c); else list.forEach(function (x) { s.piles[to.at].push([x, true]); }); moves++; chosen = null; var said = (list.length > 1 ? 'Moved ' + name(c) + ' and ' + (list.length - 1) + (list.length === 2 ? ' card' : ' cards') + ' on it' : 'Moved ' + name(c)) + (to.where === 'home' ? ' home' : s.piles[to.at].length === list.length ? ' to an empty pile' : ' onto ' + name(s.piles[to.at][s.piles[to.at].length - list.length - 1][0])) + (turned ? ', and turned up ' + name(s.piles[from.at][from.index - 1][0]) : '') + '.'; after(said); return true; } // Where a card goes when it is clicked twice: home first, then a pile it fits on, from the left. function best(from) { var list = cards(from); if (list.length === 1 && homeTakes(list[0])) return { where: 'home', at: suit(list[0]) }; for (var p = 0; p < 7; p++) if (!(from.where === 'pile' && from.at === p) && pileTakes(p, list[0]) && !(rank(list[0]) === 12 && from.where === 'pile' && from.index === 0)) return { where: 'pile', at: p }; return null; } function turnStock() { if (k.over()) return; remember(); chosen = null; if (s.stock.length) { for (var i = 0; i < DRAW && s.stock.length; i++) s.waste.push(s.stock.pop()); moves++; after('Turned up ' + name(s.waste[s.waste.length - 1]) + '.'); } else if (s.waste.length) { s.stock = s.waste.reverse(); s.waste = []; after('The waste goes back to the stock.'); } else { history.pop(); k.status('The stock and the waste are empty.'); } } // Every card that can go home goes, until none can. function sendHome() { if (k.over()) return; var sent = 0, went = true; remember(); while (went) { went = false; var tops = [{ where: 'waste' }]; for (var p = 0; p < 7; p++) if (s.piles[p].length) tops.push({ where: 'pile', at: p, index: s.piles[p].length - 1 }); for (var i = 0; i < tops.length; i++) { var c = cards(tops[i])[0]; if (c !== undefined && homeTakes(c)) { take(tops[i], 1); s.home[suit(c)].push(c); sent++; moves++; went = true; } } } if (!sent) { history.pop(); k.status('No card can go home now.'); return; } chosen = null; after(sent === 1 ? 'One card went home.' : sent + ' cards went home.'); } function homeCount() { return s.home.reduce(function (a, h) { return a + h.length; }, 0); } function after(said) { draw(); if (homeCount() === 52) { homeBtn.disabled = undoBtn.disabled = true; return k.won('All 52 cards are home, in ' + moves + ' moves!'); } k.status(said + ' ' + homeCount() + ' of 52 home.'); } // The board, drawn again after every move; the focus goes back to the place it was at. function cardEl(c, up, key, label) { var b = k.el('button', 'kl-card' + (up ? ' is-up' + (red(c) ? ' is-red' : '') : ' is-down')); b.type = 'button'; b.setAttribute('data-key', key); if (up) { b.setAttribute('data-card', c); b.appendChild(k.el('span', 'kl-corner', RANKS[rank(c)] + S f (i > 0) b.classList.add(pile[i - 1][1] ? 'after-up' : 'after-down'); col.appendChild(b); }); row.appendChild(col); }); table.appendChild(row); homeBtn.disabled = k.over(); undoBtn.disabled = k.over() || !history.length; if (had) { var back = table.querySelector('[data-key="' + had + '"]'); if (!back && /^pile\d/.test(had)) back = [].filter.call(table.querySelectorAll('[data-key^="' + had.replace(/-.*/, '') + '"]'), function (b) { return !b.classList.contains('is-down'); }).pop(); if (back) back.focus(); } } function refuse() { k.status('It cannot go there - pick another place, or the card again to put it down.'); } // A card clicked: picked up, sent on when it was picked already, or put down. function pick(at) { if (k.over()) return; if (same(chosen, at)) { var to = best(at); if (to && move(at, to)) return; chosen = null; draw(); return k.status('Put down - it has no place to go.'); } if (!cards(at).length) return; chosen = at; draw(); var list = cards(at); k.status('Picked up ' + name(list[0]) + (list.length > 1 ? ' and the ' + (list.length - 1) + ' on it' : '') + ' - click where it goes, or it again to send it on.'); } function newGame() { k.fresh(); s = deal(); history = []; chosen = null; moves = 0; table = k.el('div', 'kl-table'); k.board.appendChild(table); draw(); k.status('Build the four suits up from ace to king - click a card, then where it goes.'); } k.button('New deal', function () { newGame(); }); homeBtn = k.button('Home', sendHome); homeBtn.setAttribute('aria-label', 'Send every card that can go home'); undoBtn = k.button('Undo', function () { if (!history.length || k.over()) return; s = history.pop(); chosen = null; moves++; draw(); k.status('Took the last move back. ' + homeCount() + ' of 52 home.'); }); newGame();});</script>
