</style><section class="pad-game pad-game-quiz" id="pad-game-quiz-c99550d2" data-pad-game="quiz" data-config="{&quot;questions&quot;:[[&quot;Which tag repeats its content?&quot;,[&quot;while&quot;,&quot;if&quot;,&quot;set&quot;]],[&quot;Which sigil prints a field raw?&quot;,[&quot;!&quot;,&quot;$&quot;,&quot;#&quot;]],[&quot;What does a single tag end with?&quot;,[&quot;a slash&quot;,&quot;a colon&quot;,&quot;a comma&quot;]]],&quot;order&quot;:false,&quot;name&quot;:&quot;Quiz&quot;}" aria-label="Quiz"><header class="pg-head"><strong class="pg-title">Quiz</strong><span class="pg-status" role="status" aria-live="polite"></span></header><div class="pg-board"></div><div class="pg-bar"></div><noscript><p class="pg-noscript">This game is played in the browser and needs JavaScript.</p></noscript></section><script>/* The runtime of the PAD games (pad/games/_lib/game.php writes it once per page). A game's
   script registers itself - PadGames.register('memory', function (k, cfg) { ... }) - and is
   started on every board of its kind: the ones on the page, and the ones a fragment, a live
   region or a script brings later. k is the game's kit: its board, its status line and its
   bar, a random number seeded by seed= (the same games on every load) or by the browser,
   timers that stop with the game, and the end of a game, which the board carries as
   data-result="won" or "lost" and announces with a pad-game-end event. */

(function () {
  'use strict';

  if (window.PadGames) return;

  var kinds = {};

  // mulberry32: a small, fast generator whose numbers follow from the seed alone.

  function random(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function Kit(root, cfg) {
    this.root = root;
    this.cfg = cfg;
    this.board = root.querySelector('.pg-board');
    this.bar = root.querySelector('.pg-bar');
    this.statusEl = root.querySelector('.pg-status');
    this.seed = (typeof cfg.seed === 'number') ? cfg.seed : Math.floor(Math.random() * 2147483647);
    this.rand = random(this.seed);
    this.timers = [];
  }

  Kit.prototype = {
    el: el,
    int: function (n) { return Math.floor(this.rand() * n); },
    pick: function (list) { return list[this.int(list.length)]; },
    shuffle: function (list) {
      for (var i = list.length - 1; i > 0; i--) {
        var j = this.int(i + 1), t = list[i];
        list[i] = list[j];
        list[j] = t;
      }
      return list;
    },
    status: function (text) { this.statusEl.textContent = text; },
    button: function (label, fn, cls) {
      var b = el('button', 'pg-button' + (cls ? ' ' + cls : ''), label);
      b.type = 'button';
      b.addEventListener('click', fn);
      this.bar.appendChild(b);
      return b;
    },
    // A new game: the board emptied, the result and the timers of the last one gone.
    fresh: function () {
      this.stop();
      this.board.textContent = '';
      this.root.classList.remove('is-won', 'is-lost');
      this.root.removeAttribute('data-result');
    },
    won: function (text) { this.finish('won', text); },
    lost: function (text) { this.finish('lost', text); },
    finish: function (result, text) {
      this.stop();
      this.root.classList.add(result === 'won' ? 'is-won' : 'is-lost');
      this.root.setAttribute('data-result', result);

      this.root.dispatchEvent(new CustomEvent('pad-game-end', { bubbles: true, detail: { result: result } }));
    },
    over: function () { return this.root.hasAttribute('data-result'); },
    later: function (fn, ms) { var t = setTimeout(fn, ms); this.timers.push(t); return t; },
    every: function (fn, ms) { var t = setInterval(fn, ms); this.timers.push(t); return t; },
    stop: function () {

    keys: function (map) {

        var fn = map[e.key];
        if (fn && fn(e) !== false) e.preventDefault();

    swipe: function (fn) {

      board.addEventListener('touchend', function (e) {

  function start(root) {
    if (root.padGameKit) return;
    var init = kinds[root.getAttribute('data-pad-game')];
    if (!init) return;
    var cfg = {};
    try { cfg = JSON.parse(root.getAttribute('data-config') || '{}') || {}; } catch (e) { cfg = {}; }

    root.padGameKit = kit;
    root.classList.add('is-ready');
    init(kit, cfg);

    var list = (where || document).querySelectorAll('.pad-game[data-pad-game]');
    for (var i = 0; i < list.length; i++) start(list[i]);

  window.PadGames = {
    register: function (name, init) { kinds[name] = init; scan(); },
    scan: scan,
    random: random,
    el: el

  document.addEventListener('DOMContentLoaded', function () { scan(); });

  if (window.MutationObserver)

        }
    }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script><script>PadGames.register('quiz', function (k, cfg) {
  var list, at, score, answered;

  function ask() {
    k.board.textContent = '';
    var q = list[at], box = k.el('div', 'quz-box');
    box.appendChild(k.el('p', 'quz-count', 'Question ' + (at + 1) + ' of ' + list.length));
    box.appendChild(k.el('p', 'quz-question', q[0]));
    var answers = k.el('div', 'quz-answers'), shuffled = k.shuffle(q[1].map(function (a, i) { return [a, i === 0]; }));
    answered = false;
    shuffled.forEach(function (a) {
      var b = k.el('button', 'quz-answer', a[0]);
      b.type = 'button';
      if (a[1]) b.setAttribute('data-right', '');
      b.addEventListener('click', function () {
        if (answered || k.over()) return;
        answered = true;
        [].forEach.call(answers.children, function (x) { x.disabled = true; if (x.hasAttribute('data-right')) x.classList.add('is-right'); });
        if (a[1]) { score++; k.status('Right! ' + score + ' of ' + (at + 1)); }
        else { b.classList.add('is-wrong'); k.status('Not quite - the answer is "' + q[1][0] + '". ' + score + ' of ' + (at + 1)); }
        nextBtn.hidden = false;
        nextBtn.textContent = at + 1 < list.length ? 'Next question' : 'See the score';
        nextBtn.focus();
      });
      answers.appendChild(b);
    });
    box.appendChild(answers);
    nextBtn = k.el('button', 'pg-button quz-next', 'Next question');
    nextBtn.type = 'button';
    nextBtn.hidden = true;
    nextBtn.addEventListener('click', function () {
      at++;
      if (at < list.length) return ask();
      k.board.textContent = '';
      var text = score + ' of ' + list.length + ' right';
      score * 2 >= list.length ? k.won(text + (score === list.length ? ' - every one!' : '.')) : k.lost(text + '.');
    });
    box.appendChild(nextBtn);
    k.board.appendChild(box);
    if (!at) k.status(list.length + ' questions - choose an answer');
  }

  var nextBtn;

  function newGame() {
    k.fresh();
    list = cfg.order ? cfg.questions.slice() : k.shuffle(cfg.questions.slice());
    at = 0;
    score = 0;
    ask();
  }

  k.button('Start again', newGame);
  newGame();
});
