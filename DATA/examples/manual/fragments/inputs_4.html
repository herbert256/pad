<div class="pad-input pad-input-stepper" data-pad-input="stepper" data-pad-label="Guests"><label for="guests">Guests</label><div class="pi-stepper-row"><button type="button" class="pi-button pi-step" data-step="-1" aria-controls="guests" aria-label="Decrease Guests" tabindex="-1" hidden="">−</button><input type="number" name="guests" id="guests" step="1" value="12" aria-invalid="true" aria-describedby="guests-error"><button type="button" class="pi-button pi-step" data-step="1" aria-controls="guests" aria-label="Increase Guests" tabindex="-1" hidden="">+</button></div></div><span class="error" id="guests-error">Guests must be between 1 and 8</span><script>/* stars - the button that takes a rating back, for a field that is not required: a radio group once chosen cannot be emptied otherwise. It shows while a star is chosen. */PadInputs.register('stars', function (frame, cfg, kit) { var radios = frame.querySelectorAll('.pi-star-input'); var clear = frame.querySelector('.pi-stars-clear'); if (!radios.length || !clear || !cfg.clear) return; var name = kit.label(frame); clear.setAttribute('aria-label', 'Clear ' + (name || 'the rating')); function chosen() { for (var i = 0; i < radios.length; i++) if (radios[i].checked) return radios[i]; return null; } function sync() { clear.hidden = !chosen(); } frame.addEventListener('change', sync); clear.addEventListener('click', function () { var one = chosen(); if (!one) return; one.checked = false; sync(); kit.changed(radios[0]); radios[0].focus(); }); sync();});</script><fieldset class="pad-input pad-input-stars" data-pad-input="stars" data-pad-label="Rating" data-config="{&quot;max&quot;:5,&quot;clear&quot;:true}"><legend>Rating</legend><span class="pi-stars"><input type="radio" class="pi-star-input" name="score" id="score" value="1" aria-invalid="true" aria-describedby="score-error"><label class="pi-star" for="score"><span class="pi-hide">1 star of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-2" value="2" aria-invalid="true" aria-describedby="score-error"><label class="pi-star" for="score-2"><span class="pi-hide">2 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-3" value="3" aria-invalid="true" aria-describedby="score-error"><label class="pi-star" for="score-3"><span class="pi-hide">3 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-4" value="4" aria-invalid="true" aria-describedby="score-error"><label class="pi-star" for="score-4"><span class="pi-hide">4 stars of 5</span></label><input type="radio" class="pi-star-input" name="score" id="score-5" value="5" aria-invalid="true" aria-describedby="score-error"><label class="pi-star" for="score-5"><span class="pi-hide">5 stars of 5</span></label></span><button type="button" class="pi-button pi-stars-clear" hidden="">Clear</button></fieldset><span class="error" id="score-error">Rating is required</span>
